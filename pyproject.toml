[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "win-ocr-type"
dynamic = ["version"]
description = "Windows 截屏 OCR 自动输入：按 F9 框选屏幕文字，识别后逐字敲进当前窗口，不走剪贴板"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ocr", "windows", "automation", "auto-typing", "screenshot", "pynput"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Text Processing",
]
dependencies = [
    "pillow>=9.0",
    "pynput>=1.7",
    "winocr>=1.0",
]

[project.scripts]
win-ocr-type = "win_ocr_type:main"

[project.urls]
Homepage = "https://github.com/nT6fs/win-ocr-type"
Repository = "https://github.com/nT6fs/win-ocr-type"
"Bug Tracker" = "https://github.com/nT6fs/win-ocr-type/issues"

[tool.setuptools]
py-modules = ["win_ocr_type"]

[tool.setuptools.dynamic]
version = { attr = "win_ocr_type.__version__" }
